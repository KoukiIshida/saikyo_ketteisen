<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>最強決定戦</title>
<script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{
  --good:#2e7d32; --bad:#c62828; --warn:#e08b1e; --exempt:#b8860b;
  --accent:#3a6df0; --bg-host:#161a24; --panel-host:#232838;
}
*{box-sizing:border-box;}
body{font-family:"Hiragino Kaku Gothic ProN","Meiryo",sans-serif; margin:0; padding:0;}
.page{display:none;}
.page.active{display:block;}
button{cursor:pointer; font-family:inherit;}
.muted{color:#888;}
img{max-width:100%;}

/* ---- Admin ---- */
#page-admin.active{background:#f2f3f7; min-height:100vh; padding:16px;}
.admin-wrap{max-width:900px; margin:0 auto;}
.card{background:#fff; border-radius:10px; padding:16px; margin-bottom:16px; box-shadow:0 1px 3px rgba(0,0,0,.1);}
.card h2{margin-top:0;}
.row{display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin:8px 0;}
input[type=text], input[type=number], textarea, select{padding:8px; border:1px solid #ccc; border-radius:6px; font-size:14px;}
textarea{width:100%; font-family:inherit;}
.btn-mini{padding:6px 10px; border:1px solid #999; background:#fff; border-radius:6px; font-size:13px;}
.btn-primary{padding:12px 22px; border:none; background:var(--accent); color:#fff; border-radius:8px; font-size:16px; font-weight:bold;}
.btn-primary:disabled{background:#aaa; cursor:not-allowed;}
.btn-good{border-color:var(--good); color:var(--good);}
.btn-bad{border-color:var(--bad); color:var(--bad);}
.sticky-actions{position:sticky; bottom:0; background:#f2f3f7; padding:10px 0;}
.rich-toolbar button{margin-right:4px;}
.rule-edit{border:1px solid #ccc; border-radius:6px; min-height:100px; padding:10px; background:#fff;}
.thumb{max-width:160px; max-height:120px; display:block; margin-top:6px; border-radius:6px; cursor:zoom-in;}
.thumb-sm{max-width:60px; max-height:60px; border-radius:4px;}
.q-card{border:1px solid #ddd; border-radius:8px; margin-bottom:8px; background:#fafbfe;}
.q-head{display:flex; align-items:center; gap:8px; padding:8px 10px; flex-wrap:wrap;}
.drag-handle{cursor:grab; color:#999;}
.q-idx{font-weight:bold; color:#555;}
.q-title-preview{flex:1; color:#333; min-width:80px;}
.chk{font-size:12px; display:flex; align-items:center; gap:3px; white-space:nowrap;}
.q-detail{padding:10px; border-top:1px dashed #ccc; display:flex; flex-direction:column; gap:8px;}
.answers-block{background:#eef1fa; border-radius:6px; padding:10px;}
.choice-row{display:flex; gap:6px; align-items:center; margin-bottom:6px; flex-wrap:wrap;}
.choice-row input[type=text]{flex:1; min-width:120px;}

/* ---- Save overlay ---- */
.save-overlay{position:fixed; inset:0; background:rgba(0,0,0,.6); display:none; align-items:center; justify-content:center; z-index:999;}
.save-overlay.active{display:flex;}
.save-box{background:#fff; padding:24px 30px; border-radius:10px; text-align:center; min-width:240px;}
.spinner{width:36px; height:36px; border:4px solid #ddd; border-top-color:var(--accent); border-radius:50%; margin:0 auto 10px; animation:spin 1s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.save-bar-outer{background:#eee; border-radius:6px; height:10px; margin-top:10px; overflow:hidden;}
.save-bar-inner{background:var(--accent); height:100%; width:0%; transition:width .2s;}

/* ---- Image modal ---- */
.img-modal{position:fixed; inset:0; background:rgba(0,0,0,.85); display:none; align-items:center; justify-content:center; z-index:998;}
.img-modal.active{display:flex;}
.img-modal img{max-width:92vw; max-height:92vh;}

/* ---- Host ---- */
#page-host.active{background:var(--bg-host); color:#fff; min-height:100vh;}
.host-topbar{display:flex; justify-content:space-between; align-items:center; padding:10px 18px; background:#10131b;}
.host-topbar-actions{display:flex; gap:8px;}
.host-title{font-weight:bold; font-size:18px;}
.host-lobby,.host-rule,.host-qualifying,.host-reveal,.host-results,.host-semifinal,.host-semifinal-reveal,.host-semifinal-manual,.host-final-intro,.host-final,.host-champion{padding:24px; text-align:center;}
#qrcode-box{display:inline-block; background:#fff; padding:12px; border-radius:10px;}
.join-url{font-size:12px; color:#9aa; word-break:break-all;}
.player-chips{display:flex; flex-wrap:wrap; gap:8px; justify-content:center; margin:14px 0;}
.chip{background:#2b3245; padding:6px 12px; border-radius:20px; font-size:13px;}
.chip-off{opacity:.4;}
.chip-good{background:var(--good);}
.chip-ref{opacity:.6; font-style:italic;}
.big-timer{font-size:56px; font-weight:bold; font-variant-numeric:tabular-nums; margin:14px 0;}
.q-text-big{font-size:26px; margin:14px 0; white-space:pre-wrap;}
.q-img{max-height:38vh; border-radius:8px; margin:10px auto; display:block; cursor:zoom-in;}
.reveal-progress{color:#9aa; margin-bottom:8px;}
.reveal-answers{max-width:640px; margin:14px auto;}
.ans-row{display:flex; justify-content:space-between; background:#232838; padding:10px 16px; border-radius:8px; margin-bottom:6px;}
.ans-correct{background:#204d29; outline:2px solid var(--good);}
.ans-ref{opacity:.6;}
.correct-label{font-size:22px; color:#ffd166; margin-bottom:10px;}
.result-text{margin-top:12px; font-size:18px; color:#ffd166;}
.advanced-badges{margin-bottom:10px;}
.tag{display:inline-block; padding:3px 10px; border-radius:14px; font-size:12px; margin-left:6px;}
.tag-pass{background:var(--good); color:#fff;}
.tag-fail{background:var(--bad); color:#fff;}
.tag-exempt{background:var(--exempt); color:#fff;}
.tag-warn{background:var(--warn); color:#fff;}
.rank-list{max-width:640px; margin:14px auto;}
.rank-row{display:flex; align-items:center; gap:10px; background:#232838; padding:10px 16px; border-radius:8px; margin-bottom:6px;}
.rank-hidden{opacity:.35;}
.rank-fail{opacity:.7;}
.rank-num{font-weight:bold; width:56px;}
.rank-name{flex:1; text-align:left;}
.rank-detail{color:#9aa; font-size:13px;}
.finalist-names,.finalist-tag{font-size:20px;}
.final-players{max-width:640px; margin:14px auto; display:flex; flex-direction:column; gap:8px;}
.final-player-row{display:flex; align-items:center; gap:10px; background:#232838; padding:10px 16px; border-radius:8px;}
.final-player-row.locked{opacity:.5;}
.final-name{flex:1; text-align:left; font-size:18px;}
.final-count{color:#9aa;}
.champion-name{font-size:44px; color:#ffd166; font-weight:bold; margin-top:20px;}
.manual-list{max-width:400px; margin:12px auto; text-align:left;}
.manual-row{display:block; padding:6px 0;}

/* ---- Participant ---- */
#page-participant.active{background:#f5f6fa; min-height:100vh; font-size:15px;}
.p-center{padding:40px 20px; text-align:center;}
.p-center input{width:80%; padding:12px; font-size:16px; margin:10px 0; border:1px solid #ccc; border-radius:8px;}
.p-center button{padding:12px 26px; font-size:16px; background:var(--accent); color:#fff; border:none; border-radius:8px;}
.p-rule{padding:16px;}
.rule-img{border-radius:8px; margin-bottom:10px; cursor:zoom-in;}
.p-timer-bar{position:sticky; top:0; background:#222; color:#fff; text-align:center; padding:8px; font-size:20px; font-variant-numeric:tabular-nums; z-index:10;}
.p-q-card{background:#fff; margin:10px; padding:14px; border-radius:10px; box-shadow:0 1px 3px rgba(0,0,0,.08);}
.p-q-num{font-weight:bold; color:var(--accent); margin-bottom:6px;}
.p-q-img{border-radius:8px; margin:8px 0; cursor:zoom-in;}
.p-q-text{font-size:16px; white-space:pre-wrap; margin-bottom:10px;}
.p-text-input{width:100%; padding:10px; font-size:16px;}
.p-choices{display:flex; flex-direction:column; gap:8px;}
.p-choice{border:2px solid #ccc; border-radius:8px; padding:10px; text-align:center;}
.p-choice.selected{border-color:var(--accent); background:#eaf0ff;}
.p-choice img{max-height:120px; border-radius:6px;}
.p-select-hint{font-size:12px; color:#888; margin-top:4px;}
#btn-submit-qualifying{display:block; width:calc(100% - 20px); margin:16px 10px 30px; padding:16px; font-size:18px; background:var(--good); color:#fff; border:none; border-radius:10px; font-weight:bold;}
.p-semifinal,.p-final{padding:16px;}
.final-score-row{background:#fff; padding:8px 12px; border-radius:6px; margin-bottom:6px;}
.flash-toast{position:fixed; left:50%; bottom:30px; transform:translate(-50%,20px); background:#333; color:#fff; padding:10px 18px; border-radius:20px; opacity:0; transition:.25s; pointer-events:none; z-index:1000;}
.flash-toast.show{opacity:1; transform:translate(-50%,0);}
</style>
</head>
<body>

<div id="page-admin" class="page">
  <div class="admin-wrap">
    <h1>大会管理画面</h1>
    <section class="card">
      <h2>大会設定</h2>
      <label>タイトル<br><input id="f-title" type="text" style="width:100%"></label>
    </section>
    <section class="card">
      <h2>ルール説明</h2>
      <div class="rich-toolbar">
        <button type="button" data-cmd="bold">太字</button>
        <button type="button" data-cmd="foreColor" data-val="#d33">赤字</button>
        <button type="button" data-cmd="foreColor" data-val="#000">黒字</button>
        <button type="button" data-cmd="upsize">大文字</button>
        <button type="button" data-cmd="removeFormat">標準文字</button>
      </div>
      <div id="rule-edit" contenteditable="true" class="rule-edit"></div>
      <div class="row">
        <input type="file" id="rule-img-input" accept="image/*">
        <button type="button" id="rule-img-remove" class="btn-mini">画像を削除</button>
      </div>
      <img id="rule-img-preview" class="thumb" style="display:none">
    </section>
    <section class="card">
      <h2>予選設定</h2>
      <div class="row">
        <label>制限時間（分）<input id="q-time" type="number" min="1" style="width:70px"></label>
        <label>合格ライン（正解数）<input id="q-pass" type="number" min="0" style="width:70px"></label>
        <label class="chk"><input id="q-exempt" type="checkbox"> 満点＋最速タイムの人を準決勝免除にする</label>
      </div>
      <div id="q-list"></div>
      <button type="button" id="q-add" class="btn-mini">＋ 問題を追加</button>
    </section>
    <section class="card">
      <h2>準決勝設定（近似値クイズ）</h2>
      <label>回答制限時間（秒・全問共通）<input id="sf-time" type="number" min="5" style="width:70px"></label>
      <div id="sf-list"></div>
      <button type="button" id="sf-add" class="btn-mini">＋ 問題を追加</button>
    </section>
    <section class="card">
      <h2>決勝設定（早押し）</h2>
      <div id="fn-list"></div>
      <button type="button" id="fn-add" class="btn-mini">＋ 問題を追加</button>
    </section>
    <section class="card">
      <h2>出題設定 最終確認</h2>
      <div id="confirm-panel"></div>
    </section>
    <section class="card">
      <h2>データの引き継ぎ</h2>
      <p class="muted">問題データはこの端末・このブラウザにだけ保存されています。GitHub等に公開した先（別のURL＝別の保存場所）に同じ内容を持って行きたい場合は、ここで書き出したJSONファイルを公開後の管理画面で読み込んでください。</p>
      <div class="row">
        <button type="button" id="btn-export" class="btn-mini">📤 データを書き出す（JSON）</button>
        <button type="button" id="btn-import" class="btn-mini">📥 データを読み込む（JSON）</button>
        <input type="file" id="import-file-input" accept="application/json" style="display:none">
      </div>
    </section>
    <div class="row sticky-actions">
      <button type="button" id="btn-save" class="btn-primary">💾 保存する</button>
      <button type="button" id="btn-open-host" class="btn-mini">▶ ホスト画面を開く</button>
    </div>
  </div>
</div>

<div id="page-host" class="page">
  <div id="host-root"></div>
</div>

<div id="page-participant" class="page">
  <div id="participant-root"></div>
</div>

<div id="img-modal" class="img-modal"><img id="img-modal-src"></div>
<div id="save-overlay" class="save-overlay">
  <div class="save-box">
    <div class="spinner"></div>
    <div id="save-msg">保存中…</div>
    <div class="save-bar-outer"><div id="save-bar" class="save-bar-inner"></div></div>
    <div id="save-pct">0%</div>
  </div>
</div>

<script>
/* ---------- constants ---------- */
const DB_NAME='saikyou_db', STORE_NAME='kv';
const LS_ROOM='saikyou_room', LS_STATE='saikyou_gamestate';
const SS_PID='saikyou_pid', SS_NAME='saikyou_name';
const params=new URLSearchParams(location.search);
const MODE = params.get('mode')==='admin' ? 'admin' : (params.has('room') ? 'participant' : 'host');

/* ---------- utils ---------- */
function uid(p){return (p||'id')+'_'+Date.now().toString(36)+Math.random().toString(36).slice(2,8);}
function escapeHtml(s){return (s==null?'':String(s)).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function fmtTime(ms){ ms=Math.max(0,ms); const s=Math.floor(ms/1000); const m=Math.floor(s/60); const r=s%60; return m+':'+String(r).padStart(2,'0'); }
function flashMessage(text){
  let el=document.getElementById('flash-toast');
  if(!el){ el=document.createElement('div'); el.id='flash-toast'; el.className='flash-toast'; document.body.appendChild(el); }
  el.textContent=text; el.classList.add('show');
  clearTimeout(el._t); el._t=setTimeout(()=>el.classList.remove('show'),1800);
}
function openImgModal(src){ document.getElementById('img-modal-src').src=src; document.getElementById('img-modal').classList.add('active'); }
function closeImgModal(){ document.getElementById('img-modal').classList.remove('active'); }
document.getElementById('img-modal').addEventListener('click', closeImgModal);
document.addEventListener('click', e=>{
  if(e.target.tagName==='IMG' && e.target.closest('.p-q-img,.q-img,.rule-img,.thumb,.p-choice img')){ openImgModal(e.target.src); }
});

/* ---------- wake lock ---------- */
let wakeLock=null;
async function requestWakeLock(){ try{ wakeLock=await navigator.wakeLock.request('screen'); }catch(e){} }
document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState==='visible' && !wakeLock) requestWakeLock(); });

/* ---------- IndexedDB ---------- */
function openDb(){return new Promise((res,rej)=>{const r=indexedDB.open(DB_NAME,1);r.onupgradeneeded=()=>{r.result.createObjectStore(STORE_NAME);};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});}
async function idbGet(){const db=await openDb();return new Promise((res,rej)=>{const tx=db.transaction(STORE_NAME,'readonly');const rq=tx.objectStore(STORE_NAME).get('appData');rq.onsuccess=()=>res(rq.result||null);rq.onerror=()=>rej(rq.error);});}
async function idbSet(data){const db=await openDb();return new Promise((res,rej)=>{const tx=db.transaction(STORE_NAME,'readwrite');tx.objectStore(STORE_NAME).put(data,'appData');tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error);});}

/* ---------- data model ---------- */
function defaultAppData(){return {
  eventTitle:'○○最強決定戦',
  ruleText:'', ruleImg:null,
  qualifying:{ timeLimitMinutes:5, passThreshold:3, semifinalExemptionEnabled:true, questions:[] },
  semifinal:{ timeLimitSeconds:30, questions:[] },
  final:{ questions:[] }
};}
function makeQA(type){return {id:uid('q'), prompt:{text:'',img:null}, type:type||'text', correctTexts:[''], choices:[{text:'',img:null},{text:'',img:null}], layout:'text', correctIndices:[], selectCount:1, include:true, done:false};}
function makeSF(){return {id:uid('s'), prompt:{text:'',img:null}, targetNumber:0, include:true, done:false};}

let appData=defaultAppData();

function compressImageFile(file, maxDim, quality){
  maxDim=maxDim||1000; quality=quality||0.8;
  return new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onload=e=>{
      const img=new Image();
      img.onload=()=>{
        let w=img.width,h=img.height;
        if(w>h){ if(w>maxDim){h=Math.round(h*maxDim/w);w=maxDim;} } else { if(h>maxDim){w=Math.round(w*maxDim/h);h=maxDim;} }
        const canvas=document.createElement('canvas'); canvas.width=w; canvas.height=h;
        canvas.getContext('2d').drawImage(img,0,0,w,h);
        resolve(canvas.toDataURL('image/jpeg',quality));
      };
      img.onerror=reject;
      img.src=e.target.result;
    };
    reader.onerror=reject;
    reader.readAsDataURL(file);
  });
}

function showSaveOverlay(msg){document.getElementById('save-overlay').classList.add('active'); setSaveProgress(0,msg||'保存中…');}
function setSaveProgress(pct,msg){document.getElementById('save-bar').style.width=pct+'%'; document.getElementById('save-pct').textContent=Math.round(pct)+'%'; if(msg)document.getElementById('save-msg').textContent=msg;}
function hideSaveOverlay(){document.getElementById('save-overlay').classList.remove('active');}
async function persistAppData(){
  showSaveOverlay('保存中…');
  setSaveProgress(40);
  await idbSet(appData);
  setSaveProgress(100,'保存しました');
  setTimeout(hideSaveOverlay,400);
}

/* ---------- boot ---------- */
document.addEventListener('DOMContentLoaded', init);
async function init(){
  const loaded=await idbGet();
  if(loaded){
    const d=defaultAppData();
    appData=Object.assign({}, d, loaded);
    appData.qualifying=Object.assign({},d.qualifying, loaded.qualifying||{});
    appData.semifinal=Object.assign({},d.semifinal, loaded.semifinal||{});
    appData.final=Object.assign({},d.final, loaded.final||{});
  }
  document.title = appData.eventTitle || '最強決定戦';
  if(MODE==='admin'){ document.getElementById('page-admin').classList.add('active'); initAdmin(); }
  else if(MODE==='participant'){ document.getElementById('page-participant').classList.add('active'); initParticipant(); }
  else { document.getElementById('page-host').classList.add('active'); initHost(); }
}

/* ================= ADMIN ================= */
let expandedIds=new Set();

function initAdmin(){
  document.getElementById('f-title').value=appData.eventTitle;
  document.getElementById('f-title').addEventListener('change',e=>{appData.eventTitle=e.target.value;});

  const ruleEdit=document.getElementById('rule-edit');
  ruleEdit.innerHTML=appData.ruleText||'';
  ruleEdit.addEventListener('input',()=>{appData.ruleText=ruleEdit.innerHTML;});
  document.querySelectorAll('.rich-toolbar button').forEach(btn=>{
    btn.addEventListener('mousedown',e=>{e.preventDefault();});
    btn.addEventListener('click',()=>{
      ruleEdit.focus();
      const cmd=btn.dataset.cmd;
      if(cmd==='upsize'){ wrapSelectionBig(); }
      else if(cmd==='foreColor'){ document.execCommand('foreColor',false, btn.dataset.val); }
      else { document.execCommand(cmd,false,null); }
      appData.ruleText=ruleEdit.innerHTML;
    });
  });
  renderRuleImg();
  document.getElementById('rule-img-input').addEventListener('change', async e=>{
    const f=e.target.files[0]; if(!f) return;
    appData.ruleImg=await compressImageFile(f);
    renderRuleImg();
  });
  document.getElementById('rule-img-remove').addEventListener('click',()=>{appData.ruleImg=null; renderRuleImg();});

  document.getElementById('q-time').value=appData.qualifying.timeLimitMinutes;
  document.getElementById('q-time').addEventListener('change',e=>{appData.qualifying.timeLimitMinutes=Number(e.target.value)||1;});
  document.getElementById('q-pass').value=appData.qualifying.passThreshold;
  document.getElementById('q-pass').addEventListener('change',e=>{appData.qualifying.passThreshold=Number(e.target.value)||0;});
  document.getElementById('q-exempt').checked=appData.qualifying.semifinalExemptionEnabled;
  document.getElementById('q-exempt').addEventListener('change',e=>{appData.qualifying.semifinalExemptionEnabled=e.target.checked; renderConfirm();});
  document.getElementById('q-add').addEventListener('click',()=>{appData.qualifying.questions.push(makeQA('text')); renderQList();});

  document.getElementById('sf-time').value=appData.semifinal.timeLimitSeconds;
  document.getElementById('sf-time').addEventListener('change',e=>{appData.semifinal.timeLimitSeconds=Number(e.target.value)||5;});
  document.getElementById('sf-add').addEventListener('click',()=>{appData.semifinal.questions.push(makeSF()); renderSfList();});

  document.getElementById('fn-add').addEventListener('click',()=>{appData.final.questions.push(makeQA('text')); renderFnList();});

  document.getElementById('btn-save').addEventListener('click', async ()=>{ await persistAppData(); });
  document.getElementById('btn-open-host').addEventListener('click', async ()=>{ await persistAppData(); window.open(location.pathname,'_blank'); });

  attachQuestionListEvents('q-list', ()=>appData.qualifying.questions, renderQList);
  attachQuestionListEvents('fn-list', ()=>appData.final.questions, renderFnList);
  attachSfListEvents();

  renderQList(); renderSfList(); renderFnList(); renderConfirm();
}

function renderRuleImg(){
  const img=document.getElementById('rule-img-preview');
  if(appData.ruleImg){img.src=appData.ruleImg; img.style.display='block';} else {img.style.display='none';}
}
function wrapSelectionBig(){
  const sel=window.getSelection(); if(!sel.rangeCount) return;
  const range=sel.getRangeAt(0); if(range.collapsed) return;
  const span=document.createElement('span'); span.style.fontSize='1.5em';
  span.appendChild(range.extractContents()); range.insertNode(span);
}

function buildQuestionCardHTML(list,q,idx,kind){
  const expanded=expandedIds.has(q.id);
  return `<div class="q-card" draggable="true" data-kind="${kind}" data-id="${q.id}">
    <div class="q-head">
      <span class="drag-handle">⠿</span>
      <span class="q-idx">#${idx+1}</span>
      <span class="q-title-preview">${escapeHtml((q.prompt.text||'(無題)').slice(0,30))}</span>
      <label class="chk"><input type="checkbox" class="chk-include" ${q.include?'checked':''}> 出題する</label>
      <label class="chk"><input type="checkbox" class="chk-done" ${q.done?'checked':''}> 出題済み</label>
      <button type="button" class="btn-mini btn-expand">${expanded?'▲閉じる':'▼詳細'}</button>

function attachQuestionListEvents(containerId, getList, rerenderFn){
  const el=document.getElementById(containerId);
  el.addEventListener('click', e=>{
    const card=e.target.closest('.q-card'); if(!card) return;
    const list=getList(); const idx=list.findIndex(q=>q.id===card.dataset.id); if(idx<0) return; const q=list[idx];
    if(e.target.classList.contains('btn-expand')){ if(expandedIds.has(q.id)) expandedIds.delete(q.id); else expandedIds.add(q.id); rerenderFn(); }
    else if(e.target.classList.contains('btn-up')){ if(idx>0){[list[idx-1],list[idx]]=[list[idx],list[idx-1]]; rerenderFn();} }
    else if(e.target.classList.contains('btn-down')){ if(idx<list.length-1){[list[idx+1],list[idx]]=[list[idx],list[idx+1]]; rerenderFn();} }
    else if(e.target.classList.contains('btn-del')){ if(confirm('この問題を削除しますか？')){ list.splice(idx,1); rerenderFn(); } }
    else if(e.target.classList.contains('f-img-remove')){ q.prompt.img=null; rerenderFn(); }
    else if(e.target.classList.contains('f-choice-add')){ q.choices.push({text:'',img:null}); rerenderFn(); }
    else if(e.target.classList.contains('f-choice-del')){
      const i=Number(e.target.dataset.i); q.choices.splice(i,1);
      q.correctIndices=q.correctIndices.filter(x=>x!==i).map(x=>x>i?x-1:x);
      rerenderFn();
    }
  });
  el.addEventListener('change', e=>{
    const card=e.target.closest('.q-card'); if(!card) return;
    const list=getList(); const idx=list.findIndex(q=>q.id===card.dataset.id); if(idx<0) return; const q=list[idx];
    if(e.target.classList.contains('chk-include')){ q.include=e.target.checked; renderConfirm(); return; }
    else if(e.target.classList.contains('chk-done')){ q.done=e.target.checked; return; }
    else if(e.target.classList.contains('f-text')){ q.prompt.text=e.target.value; rerenderFn(); return; }
    else if(e.target.classList.contains('f-type')){ q.type=e.target.value; rerenderFn(); return; }
    else if(e.target.classList.contains('f-layout')){ q.layout=e.target.value; return; }
    else if(e.target.classList.contains('f-select-count')){ q.selectCount=Math.max(1,Number(e.target.value)||1); return; }
    else if(e.target.classList.contains('f-correct-text-csv')){
      q.correctTexts = e.target.value.split(',').map(s=>s.trim()).filter(s=>s.length>0);
      if(q.correctTexts.length===0) q.correctTexts=[''];
      rerenderFn(); return;
    }
    else if(e.target.classList.contains('f-choice-text')){ q.choices[Number(e.target.dataset.i)].text=e.target.value; return; }
    else if(e.target.classList.contains('f-choice-correct')){
      const i=Number(e.target.dataset.i);
      if(e.target.checked){ if(!q.correctIndices.includes(i)) q.correctIndices.push(i); } else { q.correctIndices=q.correctIndices.filter(x=>x!==i); }
      return;
    }
    else if(e.target.classList.contains('f-img-input')){
      const f=e.target.files[0]; if(f){ compressImageFile(f).then(durl=>{ q.prompt.img=durl; rerenderFn(); }); }
      return;
    }
    else if(e.target.classList.contains('f-choice-img')){
      const i=Number(e.target.dataset.i); const f=e.target.files[0];
      if(f){ compressImageFile(f).then(durl=>{ q.choices[i].img=durl; rerenderFn(); }); }
      return;
    }
  });
  let dragId=null;
  el.addEventListener('dragstart', e=>{ const card=e.target.closest('.q-card'); if(card){ dragId=card.dataset.id; e.dataTransfer.effectAllowed='move'; } });
  el.addEventListener('dragover', e=>{ e.preventDefault(); });
  el.addEventListener('drop', e=>{
    e.preventDefault();
    const card=e.target.closest('.q-card'); if(!card || !dragId) return;
    const list=getList();
    const fromIdx=list.findIndex(q=>q.id===dragId), toIdx=list.findIndex(q=>q.id===card.dataset.id);
    if(fromIdx<0||toIdx<0||fromIdx===toIdx) return;
    const [item]=list.splice(fromIdx,1); list.splice(toIdx,0,item);
    dragId=null; rerenderFn();
  });
}

/* ================= HOST ================= */
let peer=null, myHostId=null, gameState=null;
let qualifyingTimerHandle=null, semifinalTimerHandle=null;

function freshGameState(){return {
  phase:'lobby',
  players:{},
  qualifying:{startedAt:null, durationMs:0, revealQIndex:0, revealSubStep:0, resultsRevealIndex:-1, resultsOrder:[], failStartIndex:-1, failRevealed:false},
  semifinal:{ roundIndex:0, candidates:[], targets:[], advancedOrder:[], neededTotal:3, exemptedId:null, roundStartedAt:null, durationMs:0, revealStage:'answers', manualSelect:false, resultText:'', manualPicks:[], _nearestGroup:[] },
  final:{ finalists:[], qIndex:0, roundState:'showing', championId:null }
};}
function genRoomId(){ return String(Math.floor(100000+Math.random()*900000)); }

async function initHost(){
  requestWakeLock();
  attachHostEnterKey();
  attachHostRootDelegation();
  const savedRoom=localStorage.getItem(LS_ROOM);
  const savedStateRaw=localStorage.getItem(LS_STATE);
  if(savedRoom && savedStateRaw){
    if(confirm('前回の続きがあります。続きから再開しますか？（キャンセルで新しい部屋を作成します）')){
      try{
        gameState=JSON.parse(savedStateRaw);
        Object.values(gameState.players).forEach(p=>{p.conn=null; p.connected=false;});
        startPeer(savedRoom);
        return;
      }catch(e){}
    } else {
      localStorage.removeItem(LS_STATE);
    }
  }
  gameState=freshGameState();
  startPeer(null);
}

function startPeer(roomId){
  const id = roomId || genRoomId();
  peer = new Peer(id);
  peer.on('open', pid=>{
    myHostId=pid; localStorage.setItem(LS_ROOM,pid);
    renderHost();
  });
  peer.on('connection', conn=>{
    conn.on('data', data=>handleParticipantMessage(conn,data));
    conn.on('close', ()=>{ const p=findPlayerByConn(conn); if(p){ p.connected=false; renderHost(); } });
  });
  peer.on('error', err=>{
    if(err && err.type==='unavailable-id'){ startPeer(genRoomId()); }
    else { console.error(err); }
  });
}
function findPlayerByConn(conn){ return Object.values(gameState.players).find(p=>p.conn===conn); }

function saveGameState(){
  const clone=JSON.parse(JSON.stringify(gameState, (k,v)=> k==='conn' ? undefined : v));
  localStorage.setItem(LS_STATE, JSON.stringify(clone));
}
function sendTo(playerId,msg){ const p=gameState.players[playerId]; if(p&&p.conn&&p.conn.open){ try{p.conn.send(msg);}catch(e){} } }
function broadcastAll(msg){ Object.keys(gameState.players).forEach(pid=>sendTo(pid,msg)); }
function broadcastStateSync(){ Object.keys(gameState.players).forEach(sendStateSyncTo); }

function handleParticipantMessage(conn, data){
  if(data.type==='join'){
    let p=gameState.players[data.playerId];
    if(!p){
      p=gameState.players[data.playerId]={
        name:data.name, conn, connected:true,
        qualifying:{answers:{}, correctCount:0, submitted:false, submittedAtMs:null, passed:null, exempted:false},
        semifinal:{advanced:false, lastAnswer:null},
        final:{correctCount:0, lockedUntilQuestionIdx:null}
      };
    } else {
      p.conn=conn; p.connected=true; p.name=data.name||p.name;
    }
    saveGameState(); renderHost();
    sendStateSyncTo(data.playerId);
  } else if(data.type==='answer_update' && gameState.phase==='qualifying'){
    const p=gameState.players[data.playerId]; if(!p||p.qualifying.submitted) return;
    p.qualifying.answers = data.answers||{};
    saveGameState(); renderHost();
  } else if(data.type==='qualifying_submit' && gameState.phase==='qualifying'){
    const p=gameState.players[data.playerId]; if(!p||p.qualifying.submitted) return;
    p.qualifying.answers = data.answers||{};
    p.qualifying.submitted=true;
    p.qualifying.submittedAtMs = Date.now()-gameState.qualifying.startedAt;
    saveGameState(); renderHost();
  } else if(data.type==='semifinal_answer' && gameState.phase==='semifinal'){
    const p=gameState.players[data.playerId]; if(!p) return;
    p.semifinal.lastAnswer = data.value;
    saveGameState(); renderHost();
  }
}

function sanitizeQuestionForParticipant(q){
  return { id:q.id, prompt:q.prompt, type:q.type, layout:q.layout, choices:(q.choices||[]).map(c=>({text:c.text,img:c.img})), selectCount:q.selectCount };
}
function isSemifinalTarget(playerId){ return (gameState.semifinal.targets||[]).includes(playerId); }
function includedSemifinalQuestions(){ return appData.semifinal.questions.filter(q=>q.include); }
function currentSemifinalQuestion(){ return includedSemifinalQuestions()[gameState.semifinal.roundIndex] || null; }
function includedFinalQuestions(){ return appData.final.questions.filter(q=>q.include); }
function currentFinalQuestion(){ return includedFinalQuestions()[gameState.final.qIndex] || null; }
function currentQualifyingQuestions(){ return appData.qualifying.questions.filter(q=>q.include); }

function sendStateSyncTo(playerId){
  const p=gameState.players[playerId]; if(!p) return;
  const phase=gameState.phase;
  let payload={phase, eventTitle:appData.eventTitle};
  if(phase==='rule'){ payload.ruleText=appData.ruleText; payload.ruleImg=appData.ruleImg; }
  else if(phase==='qualifying'){
    payload.questions = currentQualifyingQuestions().map(sanitizeQuestionForParticipant);
    payload.durationMs = gameState.qualifying.durationMs;
    payload.startedAt = gameState.qualifying.startedAt;
    payload.submitted = p.qualifying.submitted;
  }
  else if(phase==='qualifying_reveal' || phase==='qualifying_results'){
    payload.waiting=true; payload.message='結果発表中です。ホストの画面をご覧ください。';
  }
  else if(phase==='semifinal'){
    if(!gameState.semifinal.manualSelect){
      const q = currentSemifinalQuestion();
      payload.question = q ? {text:q.prompt.text, img:q.prompt.img} : null;
      payload.durationMs = gameState.semifinal.durationMs;
      payload.startedAt = gameState.semifinal.roundStartedAt;
      payload.alreadyAdvanced = p.semifinal.advanced;
      payload.isTarget = isSemifinalTarget(playerId);
      payload.submitted = p.semifinal.lastAnswer!=null;
    } else {
      payload.waiting=true; payload.alreadyAdvanced=p.semifinal.advanced;
      payload.message='進出者を選定中です。ホストの画面をご覧ください。';
    }
  }
  else if(phase==='semifinal_reveal'){
    payload.waiting=true; payload.alreadyAdvanced=p.semifinal.advanced;
    payload.message = gameState.semifinal.resultText || '結果発表中です。ホストの画面をご覧ください。';
  }
  else if(phase==='final_intro'){
    payload.finalists = gameState.final.finalists.map(id=>gameState.players[id]?gameState.players[id].name:'');
    payload.amFinalist = gameState.final.finalists.includes(playerId);
  }
  else if(phase==='final'){
    const q=currentFinalQuestion();
    payload.question = q ? {text:q.prompt.text, img:q.prompt.img} : null;
    payload.amFinalist = gameState.final.finalists.includes(playerId);
    payload.locked = p.final.lockedUntilQuestionIdx!=null && p.final.lockedUntilQuestionIdx>=gameState.final.qIndex;
    payload.scores = gameState.final.finalists.map(id=>({name:gameState.players[id]?gameState.players[id].name:'', count:gameState.players[id]?gameState.players[id].final.correctCount:0}));
  }
  else if(phase==='champion'){
    payload.championName = gameState.players[gameState.final.championId] ? gameState.players[gameState.final.championId].name : '';
  }
  sendTo(playerId,{type:'state_sync', payload});
}

/* ---- host actions delegation ---- */
const hostActions={
  'open-admin': ()=>{ window.open(location.pathname+'?mode=admin','_blank'); },
  'reset-room': ()=>{ if(confirm('新しい部屋を作り直しますか？進行状況はリセットされます。')){ localStorage.removeItem(LS_STATE); localStorage.removeItem(LS_ROOM); location.reload(); } },
  'restart-all': ()=>{ if(confirm('最初からやり直しますか？（全員の進行状況がリセットされます）')){ resetWholeGame(); } },
  'start-rule': ()=>{ gameState.phase='rule'; saveGameState(); broadcastStateSync(); renderHost(); },
  'start-qualifying': ()=>{ startQualifying(); },
  'force-end-qualifying': ()=>{ endQualifyingNow(); },
  'q-reveal-advance': ()=>{ advanceQualifyingReveal(); },
  'q-results-advance': ()=>{ advanceQualifyingResults(); },
  'force-end-semifinal': ()=>{ if(gameState.phase==='semifinal' && !gameState.semifinal.manualSelect) enterSemifinalReveal(); },
  'sf-reveal-advance': ()=>{ advanceSemifinalReveal(); },
  'manual-pick-toggle': (arg,btn)=>{
    const id=arg; const remaining=gameState.semifinal.neededTotal-gameState.semifinal.advancedOrder.length;
    if(btn.checked){
      if(gameState.semifinal.manualPicks.length<remaining && !gameState.semifinal.manualPicks.includes(id)) gameState.semifinal.manualPicks.push(id);
      else btn.checked=false;
    } else {
      gameState.semifinal.manualPicks=gameState.semifinal.manualPicks.filter(x=>x!==id);
    }
    renderHost();
  },
  'sf-manual-confirm': ()=>{ confirmManualSelect(); },
  'final-start': ()=>{ startFinalRound(); },
  'final-mark': (arg)=>{ const [pid,verdict]=arg.split('|'); markFinalAnswer(pid,verdict); },
  'final-next': ()=>{ nextFinalQuestion(); },
  'declare-champion': (arg)=>{ declareChampion(arg); }
};
function attachHostRootDelegation(){
  document.getElementById('host-root').addEventListener('click', e=>{
    const el=e.target.closest('[data-action]'); if(!el) return;
    const fn=hostActions[el.dataset.action]; if(fn) fn(el.dataset.arg, el);
  });
}
function attachHostEnterKey(){
  document.addEventListener('keydown', e=>{
    if(MODE!=='host') return;
    if(e.key!=='Enter') return;
    const tag=(e.target.tagName||'').toLowerCase();
    if(tag==='input'||tag==='textarea'||e.target.isContentEditable) return;
    e.preventDefault();
    handleHostEnter();
  });
}
function handleHostEnter(){
  if(!gameState) return;
  switch(gameState.phase){
    case 'qualifying_reveal': advanceQualifyingReveal(); break;
    case 'qualifying_results': advanceQualifyingResults(); break;
    case 'semifinal_reveal': advanceSemifinalReveal(); break;
    case 'final_intro': startFinalRound(); break;
    case 'final': if(currentFinalQuestion()) nextFinalQuestion(); break;
  }
}

function renderHost(){
  const root=document.getElementById('host-root');
  const eventTitle=escapeHtml(appData.eventTitle||'最強決定戦');
  let body='';
  switch(gameState.phase){
    case 'lobby': body=renderLobby(); break;
    case 'rule': body=renderRulePhase(); break;
    case 'qualifying': body=renderQualifyingMonitor(); break;
    case 'qualifying_reveal': body=renderQualifyingReveal(); break;
    case 'qualifying_results': body=renderQualifyingResults(); break;
    case 'semifinal': body=renderSemifinalPhase(); break;
    case 'semifinal_reveal': body=renderSemifinalReveal(); break;
    case 'final_intro': body=renderFinalIntro(); break;
    case 'final': body=renderFinalPhase(); break;
    case 'champion': body=renderChampion(); break;
  }
  root.innerHTML = `<div class="host-topbar"><span class="host-title">${eventTitle}</span><div class="host-topbar-actions"><button data-action="open-admin" class="btn-mini">⚙ 管理画面</button><button data-action="restart-all" class="btn-mini">🆕 最初から</button></div></div>${body}`;
  if(gameState.phase==='lobby') renderQR();
}

/* ---- lobby / rule ---- */
function renderLobby(){
  const players=Object.values(gameState.players);
  return `<div class="host-lobby">
    <h2>参加者募集中</h2>
    <div id="qrcode-box"></div>
    <p class="join-url" id="join-url-text"></p>
    <p>参加人数: <strong>${players.length}</strong>人</p>
    <div class="player-chips">${players.map(p=>`<span class="chip ${p.connected?'':'chip-off'}">${escapeHtml(p.name)}</span>`).join('')||'<span class="muted">まだ誰も参加していません</span>'}</div>
    <div class="row" style="justify-content:center">
      <button data-action="start-rule" class="btn-primary" ${players.length===0?'disabled':''}>▶ ルール説明へ進む</button>
    </div>
  </div>`;
}
function renderQR(){
  const box=document.getElementById('qrcode-box'); if(!box || !myHostId) return;
  box.innerHTML='';
  const url = location.href.split('?')[0] + '?room=' + myHostId;
  new QRCode(box, {text:url, width:220, height:220});
  const t=document.getElementById('join-url-text'); if(t){ t.textContent=url; }
}
function renderRulePhase(){
  return `<div class="host-rule">
    <h2>ルール説明</h2>
    <div class="rule-display">${appData.ruleImg?`<img class="rule-img" src="${appData.ruleImg}">`:''}${appData.ruleText||'<p class="muted">（ルール未登録）</p>'}</div>
    <button data-action="start-qualifying" class="btn-primary">▶ 予選を始める</button>
  </div>`;
}

/* ---- qualifying ---- */
function startQualifying(){
  const qs=currentQualifyingQuestions();
  if(qs.length===0){ alert('予選の問題が登録されていません'); return; }
  Object.values(gameState.players).forEach(p=>{ p.qualifying={answers:{}, correctCount:0, submitted:false, submittedAtMs:null, passed:null, exempted:false}; });
  gameState.qualifying.startedAt=Date.now();
  gameState.qualifying.durationMs = appData.qualifying.timeLimitMinutes*60000;
  gameState.phase='qualifying';
  saveGameState(); broadcastStateSync(); renderHost(); startQualifyingTimer();
}
function startQualifyingTimer(){
  clearInterval(qualifyingTimerHandle);
  qualifyingTimerHandle=setInterval(()=>{
    if(gameState.phase!=='qualifying'){ clearInterval(qualifyingTimerHandle); return; }
    const remain=gameState.qualifying.startedAt+gameState.qualifying.durationMs-Date.now();
    const timerEl=document.getElementById('qualifying-timer'); if(timerEl) timerEl.textContent=fmtTime(remain);
    if(remain<=0){ clearInterval(qualifyingTimerHandle); endQualifyingNow(); }
  },250);
}
function endQualifyingNow(){
  if(gameState.phase!=='qualifying') return;
  clearInterval(qualifyingTimerHandle);
  broadcastAll({type:'qualifying_timeup'});
  Object.values(gameState.players).forEach(p=>{
    if(!p.qualifying.submitted){ p.qualifying.submitted=true; p.qualifying.submittedAtMs=gameState.qualifying.durationMs; }
  });
  gradeQualifying();
  gameState.phase='qualifying_reveal';
  gameState.qualifying.revealQIndex=0; gameState.qualifying.revealSubStep=0;
  saveGameState(); broadcastStateSync(); renderHost();
}
function isAnswerCorrect(q, ans){
  if(!ans) return false;
  if(q.type==='text'){
    const val=(ans.text||'').trim().toLowerCase();
    if(!val) return false;
    return (q.correctTexts||[]).some(c=>c && c.trim().toLowerCase()===val);
  } else {
    const sel=(ans.selected||[]).slice().sort((a,b)=>a-b);
    const correct=(q.correctIndices||[]).slice().sort((a,b)=>a-b);
    if(sel.length===0 || sel.length!==correct.length) return false;
    return sel.every((v,i)=>v===correct[i]);
  }
}
function gradeQualifying(){
  const qs=currentQualifyingQuestions();
  Object.values(gameState.players).forEach(p=>{
    let cnt=0;
    qs.forEach(q=>{ if(isAnswerCorrect(q, p.qualifying.answers[q.id])) cnt++; });
    p.qualifying.correctCount=cnt;
    p.qualifying.passed = cnt>=appData.qualifying.passThreshold;
  });
  if(appData.qualifying.semifinalExemptionEnabled){
    const submitted=Object.values(gameState.players).filter(p=>p.qualifying.submittedAtMs!=null);
    if(submitted.length){
      const minElapsed=Math.min(...submitted.map(p=>p.qualifying.submittedAtMs));
      const perfect=qs.length;
      Object.values(gameState.players).forEach(p=>{
        p.qualifying.exempted = perfect>0 && p.qualifying.correctCount===perfect && p.qualifying.submittedAtMs===minElapsed;
      });
    }
  }
}
function renderQualifyingMonitor(){
  const players=Object.values(gameState.players);
  const remain = gameState.qualifying.startedAt+gameState.qualifying.durationMs-Date.now();
  return `<div class="host-qualifying">
    <h2>予選 解答受付中</h2>
    <div class="big-timer" id="qualifying-timer">${fmtTime(remain)}</div>
    <div class="player-chips">${players.map(p=>`<span class="chip ${p.qualifying.submitted?'chip-good':''}">${escapeHtml(p.name)} ${p.qualifying.submitted?'✅':'…'}</span>`).join('')}</div>
    <button data-action="force-end-qualifying" class="btn-mini">⏹ 今すぐ締め切る</button>
  </div>`;
}

/* ---- qualifying reveal (per question) ---- */
function formatPlayerAnswer(q,p){
  const ans=p.qualifying.answers[q.id];
  if(!ans) return '(未回答)';
  if(q.type==='text') return escapeHtml(ans.text||'(未回答)') || '(未回答)';
  const sel=ans.selected||[]; if(!sel.length) return '(未回答)';
  return sel.map(i=> escapeHtml(q.choices[i]?q.choices[i].text:('選択肢'+(i+1)))).join('、');
}
function formatCorrectAnswer(q){
  if(q.type==='text') return escapeHtml((q.correctTexts||[]).filter(Boolean).join(' / '));
  return (q.correctIndices||[]).map(i=> escapeHtml(q.choices[i]?q.choices[i].text:('選択肢'+(i+1)))).join('、');
}
function computeRunningCorrect(p, uptoIdx){
  const qs=currentQualifyingQuestions();
  let c=0; for(let i=0;i<=uptoIdx;i++){ if(isAnswerCorrect(qs[i], p.qualifying.answers[qs[i].id])) c++; }
  return c;
}
function renderQualifyingReveal(){
  const qs=currentQualifyingQuestions();
  const idx=gameState.qualifying.revealQIndex;
  const q=qs[idx];
  const sub=gameState.qualifying.revealSubStep;
  const players=Object.values(gameState.players);
  let content='';
  if(sub===0){
    content = `<div class="reveal-q">${q.prompt.img?`<img class="q-img" src="${q.prompt.img}">`:''}<div class="q-text-big">${escapeHtml(q.prompt.text)}</div></div>`;
  } else if(sub===1){
    content = `<div class="reveal-answers">${players.map(p=>`<div class="ans-row"><span class="ans-name">${escapeHtml(p.name)}</span><span class="ans-val">${formatPlayerAnswer(q,p)}</span></div>`).join('')}</div>`;
  } else {
    content = `<div class="reveal-correct"><div class="correct-label">正解: ${formatCorrectAnswer(q)}</div>
      <div class="reveal-answers">${players.map(p=>{
        const ok=isAnswerCorrect(q,p.qualifying.answers[q.id]);
        return `<div class="ans-row ${ok?'ans-correct':''}"><span class="ans-name">${escapeHtml(p.name)} ${ok?'⭕':''}</span><span class="ans-score">累計 ${computeRunningCorrect(p,idx)}問正解</span></div>`;
      }).join('')}</div></div>`;
  }
  const isLast = idx===qs.length-1 && sub===2;
  return `<div class="host-reveal">
    <div class="reveal-progress">第${idx+1}問 / 全${qs.length}問</div>
    ${content}
    <button data-action="q-reveal-advance" class="btn-primary">${isLast?'▶ 結果発表へ (Enter)':'次へ (Enter)'}</button>
  </div>`;
}
function advanceQualifyingReveal(){
  const qs=currentQualifyingQuestions();
  if(gameState.qualifying.revealSubStep<2){ gameState.qualifying.revealSubStep++; }
  else if(gameState.qualifying.revealQIndex<qs.length-1){ gameState.qualifying.revealQIndex++; gameState.qualifying.revealSubStep=0; }
  else {
    buildQualifyingResultsOrder();
    gameState.phase='qualifying_results';
  }
  saveGameState(); renderHost();
}

/* ---- qualifying results ---- */
function buildQualifyingResultsOrder(){
  const entries=Object.entries(gameState.players).map(([id,p])=>({id,p}));
  entries.sort((a,b)=>{
    if(b.p.qualifying.correctCount!==a.p.qualifying.correctCount) return b.p.qualifying.correctCount-a.p.qualifying.correctCount;
    return a.p.qualifying.submittedAtMs-b.p.qualifying.submittedAtMs;
  });
  let ranks=[];
  entries.forEach((entry,i)=>{
    if(i===0) ranks.push(1);
    else {
      const prev=entries[i-1];
      const same = prev.p.qualifying.correctCount===entry.p.qualifying.correctCount && prev.p.qualifying.submittedAtMs===entry.p.qualifying.submittedAtMs;
      ranks.push(same? ranks[i-1] : i+1);
    }
  });
  gameState.qualifying.resultsOrder = entries.map((e,i)=>({id:e.id, rank:ranks[i]}));
  const failIdx=entries.findIndex(e=>!e.p.qualifying.passed);
  gameState.qualifying.failStartIndex = failIdx;
  gameState.qualifying.resultsRevealIndex=-1;
  gameState.qualifying.failRevealed=false;
}
function renderQualifyingResults(){
  const order=gameState.qualifying.resultsOrder;
  const failStart=gameState.qualifying.failStartIndex<0? order.length : gameState.qualifying.failStartIndex;
  const rows=order.map((e,i)=>{
    const shown = i<=gameState.qualifying.resultsRevealIndex || (gameState.qualifying.failRevealed && i>=failStart);
    const p=gameState.players[e.id];
    if(!shown) return `<div class="rank-row rank-hidden"><span class="rank-num">?</span><span class="rank-name">???</span></div>`;
    const passTag = p.qualifying.passed? (p.qualifying.exempted?'<span class="tag tag-exempt">準決勝免除</span>':'<span class="tag tag-pass">通過</span>') : '<span class="tag tag-fail">予選敗退</span>';
    return `<div class="rank-row ${p.qualifying.passed?'':'rank-fail'}"><span class="rank-num">${e.rank}位</span><span class="rank-name">${escapeHtml(p.name)}</span><span class="rank-detail">${p.qualifying.correctCount}問正解 / ${fmtTime(p.qualifying.submittedAtMs)}</span>${passTag}</div>`;
  }).join('');
  const topDone = gameState.qualifying.resultsRevealIndex+1>=failStart;
  const failDone = failStart>=order.length || gameState.qualifying.failRevealed;
  let label;
  if(topDone && failDone) label='▶ 準決勝へ進む (Enter)';
  else if(topDone && !failDone) label='予選落ちを一斉オープン (Enter)';
  else label='次の順位を開く (Enter)';
  return `<div class="host-results"><h2>予選結果発表</h2><div class="rank-list">${rows}</div>
    <button data-action="q-results-advance" class="btn-primary">${label}</button></div>`;
}
function advanceQualifyingResults(){
  const order=gameState.qualifying.resultsOrder;
  const failStart=gameState.qualifying.failStartIndex<0? order.length : gameState.qualifying.failStartIndex;
  if(gameState.qualifying.resultsRevealIndex+1 < failStart){
    gameState.qualifying.resultsRevealIndex++;
  } else if(!gameState.qualifying.failRevealed && failStart<order.length){
    gameState.qualifying.failRevealed=true;
  } else {
    finishQualifyingResults();
    return;
  }
  saveGameState(); renderHost();
}
function finishQualifyingResults(){
  Object.entries(gameState.players).forEach(([pid,p])=>{
    sendTo(pid, {type:'state_sync', payload:{phase:'qualifying_done', passed:p.qualifying.passed, exempted:p.qualifying.exempted, eventTitle:appData.eventTitle}});
  });
  setupSemifinal();
}

/* ---- semifinal ---- */
function setupSemifinal(){
  const exemptedEntry=Object.entries(gameState.players).find(([id,p])=>p.qualifying.exempted);
  const exemptedId=exemptedEntry?exemptedEntry[0]:null;
  const candidates=Object.entries(gameState.players).filter(([id,p])=>p.qualifying.passed && id!==exemptedId).map(([id])=>id);
  const advancedOrder = exemptedId?[exemptedId]:[];
  Object.entries(gameState.players).forEach(([id,p])=>{ p.semifinal={advanced:advancedOrder.includes(id), lastAnswer:null}; });
  gameState.semifinal={ roundIndex:0, candidates:candidates.slice(), targets:candidates.slice(), advancedOrder, neededTotal:3, exemptedId, roundStartedAt:null, durationMs:0, revealStage:'answers', manualSelect:false, resultText:'', manualPicks:[], _nearestGroup:[] };
  if(advancedOrder.length>=3 || candidates.length===0){ startFinalIntro(); return; }
  startNextSemifinalQuestion();
}
function startNextSemifinalQuestion(){
  const q=currentSemifinalQuestion();
  if(!q){
    gameState.semifinal.manualSelect=true;
    gameState.semifinal.manualPicks=[];
    gameState.phase='semifinal';
    saveGameState(); broadcastStateSync(); renderHost();
    return;
  }
  Object.values(gameState.players).forEach(p=>{ p.semifinal.lastAnswer=null; });
  gameState.semifinal.roundStartedAt=Date.now();
  gameState.semifinal.durationMs=appData.semifinal.timeLimitSeconds*1000;
  gameState.phase='semifinal';
  saveGameState(); broadcastStateSync(); renderHost(); startSemifinalTimer();
}
function startSemifinalTimer(){
  clearInterval(semifinalTimerHandle);
  semifinalTimerHandle=setInterval(()=>{
    if(gameState.phase!=='semifinal' || gameState.semifinal.manualSelect){ clearInterval(semifinalTimerHandle); return; }
    const remain=gameState.semifinal.roundStartedAt+gameState.semifinal.durationMs-Date.now();
    const el=document.getElementById('semifinal-timer'); if(el) el.textContent=fmtTime(remain);
    if(remain<=0){ clearInterval(semifinalTimerHandle); enterSemifinalReveal(); }
  },250);
}
function enterSemifinalReveal(){
  clearInterval(semifinalTimerHandle);
  gameState.semifinal.revealStage='answers';
  gameState.phase='semifinal_reveal';
  saveGameState(); broadcastStateSync(); renderHost();
}
function renderSemifinalPhase(){
  if(gameState.semifinal.manualSelect) return renderManualSelect();
  const q=currentSemifinalQuestion();
  const remain=gameState.semifinal.roundStartedAt+gameState.semifinal.durationMs-Date.now();
  const advancedNames=gameState.semifinal.advancedOrder.map(id=>gameState.players[id]?gameState.players[id].name:'');
  const targets=gameState.semifinal.targets;
  const players=Object.entries(gameState.players).filter(([id])=>!gameState.semifinal.advancedOrder.includes(id));
  return `<div class="host-semifinal">
    <h2>準決勝 第${gameState.semifinal.roundIndex+1}問</h2>
    <div class="advanced-badges">${advancedNames.length? '勝ち抜け: '+advancedNames.map(n=>`<span class="tag tag-pass">${escapeHtml(n)}</span>`).join(''): ''}</div>
    ${q.prompt.img?`<img class="q-img" src="${q.prompt.img}">`:''}
    <div class="q-text-big">${escapeHtml(q.prompt.text)}</div>
    <div class="big-timer" id="semifinal-timer">${fmtTime(remain)}</div>
    <div class="player-chips">${players.map(([id,p])=>`<span class="chip ${p.semifinal.lastAnswer!=null?'chip-good':''} ${targets.includes(id)?'':'chip-ref'}">${escapeHtml(p.name)}${targets.includes(id)?'':'(参考)'} ${p.semifinal.lastAnswer!=null?'✅':'…'}</span>`).join('')}</div>
    <button data-action="force-end-semifinal" class="btn-mini">⏹ 今すぐ締め切る</button>
  </div>`;
}
function renderManualSelect(){
  const remaining = gameState.semifinal.neededTotal - gameState.semifinal.advancedOrder.length;
  const candidates = gameState.semifinal.targets;
  return `<div class="host-semifinal-manual">
    <h2>準決勝 問題切れ - 進出者を選択</h2>
    <p>残り${remaining}枠。対象者から選んでください。</p>
    <div class="manual-list">${candidates.map(id=>{
      const p=gameState.players[id]; const picked=gameState.semifinal.manualPicks.includes(id);
      return `<label class="manual-row"><input type="checkbox" data-action="manual-pick-toggle" data-arg="${id}" ${picked?'checked':''}> ${escapeHtml(p.name)}</label>`;
    }).join('')}</div>
    <button data-action="sf-manual-confirm" class="btn-primary" ${gameState.semifinal.manualPicks.length===remaining?'':'disabled'}>▶ 決勝進出者を確定</button>
  </div>`;
}
function confirmManualSelect(){
  gameState.semifinal.manualPicks.forEach(id=>{ gameState.semifinal.advancedOrder.push(id); gameState.players[id].semifinal.advanced=true; });
  gameState.semifinal.manualSelect=false;
  startFinalIntro();
}
function computeSemifinalResult(){
  const q=currentSemifinalQuestion();
  const targets=gameState.semifinal.targets;
  let best=Infinity, group=[];
  targets.forEach(id=>{
    const p=gameState.players[id]; if(!p||p.semifinal.lastAnswer==null) return;
    const diff=Math.abs(Number(p.semifinal.lastAnswer)-q.targetNumber);
    if(diff<best){ best=diff; group=[id]; } else if(diff===best){ group.push(id); }
  });
  gameState.semifinal._nearestGroup=group;
  const needed=gameState.semifinal.neededTotal-gameState.semifinal.advancedOrder.length;
  if(group.length===0){ gameState.semifinal.resultText='対象者に有効な回答がありませんでした。次の問題に進みます。'; }
  else if(group.length<=needed){
    gameState.semifinal.resultText = group.map(id=>gameState.players[id].name).join('、')+'さんが勝ち抜けです！';
  } else {
    gameState.semifinal.resultText = '同着が多数のためサドンデスに突入します: '+group.map(id=>gameState.players[id].name).join('、');
  }
}
function renderSemifinalReveal(){
  const q=currentSemifinalQuestion();
  const targets=gameState.semifinal.targets;
  const players=Object.entries(gameState.players).filter(([id])=>!gameState.semifinal.advancedOrder.includes(id));
  const stage=gameState.semifinal.revealStage;
  let body='';
  if(stage==='answers'){
    body=`<div class="reveal-answers">${players.map(([id,p])=>`<div class="ans-row ${targets.includes(id)?'':'ans-ref'}"><span class="ans-name">${escapeHtml(p.name)}${targets.includes(id)?'':'（参考）'}</span><span class="ans-val">${p.semifinal.lastAnswer!=null?p.semifinal.lastAnswer:'(未回答)'}</span></div>`).join('')}</div>`;
  } else {
    body=`<div class="reveal-correct"><div class="correct-label">正解: ${q.targetNumber}</div>
      <div class="reveal-answers">${players.map(([id,p])=>{
        const isNearest = (gameState.semifinal._nearestGroup||[]).includes(id);
        return `<div class="ans-row ${isNearest?'ans-correct':''} ${targets.includes(id)?'':'ans-ref'}"><span class="ans-name">${escapeHtml(p.name)}${isNearest?' ⭐':''}</span><span class="ans-val">${p.semifinal.lastAnswer!=null?p.semifinal.lastAnswer:'(未回答)'}</span></div>`;
      }).join('')}</div>
      <div class="result-text">${escapeHtml(gameState.semifinal.resultText)}</div>
    </div>`;
  }
  const advancedNames=gameState.semifinal.advancedOrder.map(id=>gameState.players[id]?gameState.players[id].name:'');
  return `<div class="host-semifinal-reveal">
    <h2>準決勝 第${gameState.semifinal.roundIndex+1}問 結果</h2>
    <div class="advanced-badges">${advancedNames.length?'勝ち抜け: '+advancedNames.map(n=>`<span class="tag tag-pass">${escapeHtml(n)}</span>`).join(''):''}</div>
    ${body}
    <button data-action="sf-reveal-advance" class="btn-primary">次へ (Enter)</button>
  </div>`;
}
function advanceSemifinalReveal(){
  if(gameState.semifinal.revealStage==='answers'){
    computeSemifinalResult();
    gameState.semifinal.revealStage='result';
    saveGameState(); renderHost();
    return;
  }
  const needed=gameState.semifinal.neededTotal - gameState.semifinal.advancedOrder.length;
  const nearestGroup=gameState.semifinal._nearestGroup||[];
  if(nearestGroup.length>0 && nearestGroup.length<=needed){
    nearestGroup.forEach(id=>{ gameState.semifinal.advancedOrder.push(id); gameState.players[id].semifinal.advanced=true; });
    if(gameState.semifinal.advancedOrder.length>=gameState.semifinal.neededTotal){ startFinalIntro(); return; }
    gameState.semifinal.targets = gameState.semifinal.candidates.filter(id=>!gameState.semifinal.advancedOrder.includes(id));
    gameState.semifinal.roundIndex++;
    startNextSemifinalQuestion();
    return;
  }
  if(nearestGroup.length>needed){
    gameState.semifinal.targets = nearestGroup.slice();
    gameState.semifinal.roundIndex++;
    startNextSemifinalQuestion();
    return;
  }
  gameState.semifinal.roundIndex++;
  startNextSemifinalQuestion();
}

/* ---- final ---- */
function startFinalIntro(){
  gameState.final.finalists = gameState.semifinal.advancedOrder.slice();
  gameState.final.qIndex=0; gameState.final.roundState='showing'; gameState.final.championId=null;
  gameState.final.finalists.forEach(id=>{ gameState.players[id].final={correctCount:0, lockedUntilQuestionIdx:null}; });
  gameState.phase='final_intro';
  saveGameState(); broadcastStateSync(); renderHost();
}
function renderFinalIntro(){
  const names=gameState.final.finalists.map(id=>gameState.players[id]?gameState.players[id].name:'');
  return `<div class="host-final-intro"><h2>決勝進出者</h2>
    <div class="finalist-names">${names.map(n=>`<span class="tag tag-pass finalist-tag">${escapeHtml(n)}</span>`).join('')}</div>
    <button data-action="final-start" class="btn-primary">▶ 決勝を始める (Enter)</button></div>`;
}
function startFinalRound(){
  const qs=includedFinalQuestions();
  if(qs.length===0){ alert('決勝の問題が登録されていません'); return; }
  gameState.phase='final';
  gameState.final.qIndex=0; gameState.final.roundState='showing';
  saveGameState(); broadcastStateSync(); renderHost();
}
function renderFinalPhase(){
  const q=currentFinalQuestion();
  if(!q){
    return `<div class="host-final"><h2>決勝</h2><p>登録された問題を使い切りました。手動で優勝者を決定してください。</p>
      ${gameState.final.finalists.map(id=>`<button class="btn-mini" data-action="declare-champion" data-arg="${id}">${escapeHtml(gameState.players[id].name)}を優勝に</button>`).join('')}
    </div>`;
  }
  const idx=gameState.final.qIndex;
  const rows=gameState.final.finalists.map(id=>{
    const p=gameState.players[id];
    const locked = p.final.lockedUntilQuestionIdx!=null && p.final.lockedUntilQuestionIdx>=idx;
    return `<div class="final-player-row ${locked?'locked':''}">
      <span class="final-name">${escapeHtml(p.name)}</span>
      <span class="final-count">正解数: ${p.final.correctCount} / 3</span>
      ${locked? '<span class="tag tag-fail">解答権なし</span>' : `
        <button class="btn-mini btn-good" data-action="final-mark" data-arg="${id}|correct">⭕正解</button>
        <button class="btn-mini btn-bad" data-action="final-mark" data-arg="${id}|wrong">❌不正解</button>`}
    </div>`;
  }).join('');
  return `<div class="host-final">
    <h2>決勝 第${idx+1}問${idx===includedFinalQuestions().length-1?'（最終問題）':''}</h2>
    ${q.prompt.img?`<img class="q-img" src="${q.prompt.img}">`:''}
    <div class="q-text-big">${escapeHtml(q.prompt.text)}</div>
    <div class="final-players">${rows}</div>
    <button data-action="final-next" class="btn-mini">次の問題へ (Enter)</button>
  </div>`;
}
function markFinalAnswer(pid, verdict){
  const p=gameState.players[pid]; if(!p) return;
  const idx=gameState.final.qIndex;
  if(verdict==='wrong'){
    p.final.lockedUntilQuestionIdx = idx+1;
    saveGameState(); broadcastStateSync(); renderHost();
  } else {
    p.final.correctCount++;
    if(p.final.correctCount>=3){ declareChampion(pid); return; }
    saveGameState(); broadcastStateSync(); renderHost();
  }
}
function nextFinalQuestion(){
  gameState.final.qIndex++;
  saveGameState(); broadcastStateSync(); renderHost();
}
function declareChampion(pid){
  gameState.final.championId=pid;
  gameState.phase='champion';
  saveGameState(); broadcastStateSync(); renderHost();
}
function renderChampion(){
  const name=gameState.players[gameState.final.championId]?gameState.players[gameState.final.championId].name:'???';
  return `<div class="host-champion"><h1>🏆 優勝 🏆</h1><div class="champion-name">${escapeHtml(name)}</div></div>`;
}
function resetWholeGame(){
  clearInterval(qualifyingTimerHandle); clearInterval(semifinalTimerHandle);
  const oldPlayers=gameState.players;
  gameState=freshGameState();
  Object.entries(oldPlayers).forEach(([id,p])=>{
    gameState.players[id]={name:p.name, conn:p.conn, connected:p.connected,
      qualifying:{answers:{}, correctCount:0, submitted:false, submittedAtMs:null, passed:null, exempted:false},
      semifinal:{advanced:false,lastAnswer:null}, final:{correctCount:0,lockedUntilQuestionIdx:null}};
  });
  saveGameState(); broadcastStateSync(); renderHost();
}

/* ================= PARTICIPANT ================= */
let myPlayerId=null, myName='', myConn=null, myPeer=null;
let lastPayload=null;
let qualifyingLocal={ questions:[], answers:{}, durationMs:0, startedAt:0, submitted:false };
let participantTimerHandle=null, participantTimerStartedFor=null;
let semifinalLocalSubmittedFor=null;

function initParticipant(){
  requestWakeLock();
  myPlayerId = sessionStorage.getItem(SS_PID) || uid('p');
  sessionStorage.setItem(SS_PID, myPlayerId);
  myName = sessionStorage.getItem(SS_NAME) || '';
  const roomId = new URLSearchParams(location.search).get('room');
  if(!roomId){ document.getElementById('participant-root').innerHTML='<div class="p-center"><p>QRコードから参加してください（部屋番号がありません）</p></div>'; return; }
  renderJoinOrConnecting();
  myPeer=new Peer();
  myPeer.on('open', ()=>{ connectToHost(roomId); });
  myPeer.on('error', err=>{ console.error(err); setTimeout(()=>{ try{ connectToHost(roomId); }catch(e){} },3000); });
}
function connectToHost(roomId){
  function tryConnect(){
    myConn = myPeer.connect(roomId, {reliable:true});
    myConn.on('open', ()=>{ if(myName){ sendJoin(); } else { renderNicknameForm(); } });
    myConn.on('data', handleHostMessage);
    myConn.on('close', ()=>{ renderJoinOrConnecting(); setTimeout(tryConnect, 3000); });
    myConn.on('error', ()=>{ setTimeout(tryConnect, 3000); });
  }
  tryConnect();
}
function sendJoin(){ if(myConn&&myConn.open) myConn.send({type:'join', playerId:myPlayerId, name:myName}); }
function renderJoinOrConnecting(){
  document.getElementById('participant-root').innerHTML = `<div class="p-center"><div class="spinner"></div><p>ホストに接続しています…</p></div>`;
}
function renderNicknameForm(){
  document.getElementById('participant-root').innerHTML = `<div class="p-center">
    <h2>ニックネームを入力</h2>
    <input type="text" id="nickname-input" maxlength="12" placeholder="ニックネーム"><br>
    <button id="btn-join">参加する</button>
  </div>`;
  document.getElementById('btn-join').addEventListener('click', ()=>{
    const v=document.getElementById('nickname-input').value.trim();
    if(!v){ alert('ニックネームを入力してください'); return; }
    myName=v; sessionStorage.setItem(SS_NAME,v);
    sendJoin();
  });
}
function handleHostMessage(data){
  if(data.type==='state_sync'){ lastPayload=data.payload; renderParticipant(); }
  else if(data.type==='qualifying_timeup'){ forceSubmitQualifying(); }
}

function renderParticipant(){
  const root=document.getElementById('participant-root');
  const payload=lastPayload; if(!payload) return;
  document.title = payload.eventTitle||'最強決定戦';
  switch(payload.phase){
    case 'lobby':
      root.innerHTML=`<div class="p-center"><h2>${escapeHtml(payload.eventTitle||'')}</h2><p>${escapeHtml(myName)}さん、開始までお待ちください。</p></div>`; break;
    case 'rule':
      root.innerHTML=`<div class="p-rule">${payload.ruleImg?`<img class="rule-img" src="${payload.ruleImg}">`:''}${payload.ruleText||''}<p class="muted">まもなく予選が始まります。</p></div>`; break;
    case 'qualifying':
      renderQualifyingParticipant(payload); break;
    case 'qualifying_done':
      root.innerHTML = `<div class="p-center"><h2>${payload.passed?(payload.exempted?'満点＆最速タイムでした！<br>準決勝免除で決勝進出です🎉':'予選通過です！おめでとうございます🎉'):'予選敗退でした。応援よろしくお願いします！'}</h2></div>`; break;
    case 'semifinal':
      renderSemifinalParticipant(payload); break;
    case 'semifinal_reveal':
      root.innerHTML = `<div class="p-center"><p>${escapeHtml(payload.message||'')}</p>${payload.alreadyAdvanced?'<p class="tag tag-pass">決勝進出決定</p>':''}</div>`; break;
    case 'final_intro':
      root.innerHTML = `<div class="p-center"><h2>決勝進出者</h2><p>${(payload.finalists||[]).map(n=>escapeHtml(n)).join('、')}</p>${payload.amFinalist?'<p class="tag tag-pass">あなたも決勝進出です！</p>':'<p>応援よろしくお願いします！</p>'}</div>`; break;
    case 'final':
      renderFinalParticipant(payload); break;
    case 'champion':
      root.innerHTML = `<div class="p-center"><h1>🏆優勝🏆</h1><div class="champion-name">${escapeHtml(payload.championName)}</div></div>`; break;
    default:
      root.innerHTML = `<div class="p-center"><p>${escapeHtml(payload.message||'お待ちください')}</p></div>`;
  }
}

/* ---- participant: qualifying ---- */
function renderQualifyingParticipant(payload){
  const root=document.getElementById('participant-root');
  if(payload.submitted){
    root.innerHTML = `<div class="p-center"><h2>提出しました</h2><p>結果発表をお待ちください。</p></div>`;
    clearInterval(participantTimerHandle);
    return;
  }
  if(qualifyingLocal.startedAt!==payload.startedAt){
    qualifyingLocal = { questions:payload.questions, answers:{}, durationMs:payload.durationMs, startedAt:payload.startedAt, submitted:false };
  }
  root.innerHTML = `<div class="p-qualifying"><div class="p-timer-bar"><span id="p-timer">--:--</span></div><div id="p-questions-area"></div><button id="btn-submit-qualifying">提出する</button></div>`;
  renderQuestionsArea();
  document.getElementById('btn-submit-qualifying').addEventListener('click', confirmSubmitQualifying);
  if(participantTimerStartedFor!==payload.startedAt){ participantTimerStartedFor=payload.startedAt; startParticipantTimer(); }
}
function renderQuestionsArea(){
  const area=document.getElementById('p-questions-area'); if(!area) return;
  area.innerHTML = qualifyingLocal.questions.map((q,i)=>buildParticipantQuestionHTML(q,i)).join('');
  attachParticipantQualifyingEvents();
}
function buildParticipantQuestionHTML(q,i){
  const ans=qualifyingLocal.answers[q.id]||{};
  let answerHtml='';
  if(q.type==='text'){
    answerHtml = `<input type="text" class="p-text-input" data-qid="${q.id}" value="${escapeHtml(ans.text||'')}">`;
  } else {
    const sel=ans.selected||[];
    answerHtml = `<div class="p-choices">${(q.choices||[]).map((c,ci)=>`
      <div class="p-choice ${sel.includes(ci)?'selected':''}" data-qid="${q.id}" data-ci="${ci}">
        ${(q.layout!=='text'&&c.img)?`<img src="${c.img}">`:''}
        ${(q.layout!=='image')?`<div class="p-choice-text">${escapeHtml(c.text)}</div>`:''}
      </div>`).join('')}</div>
      <div class="p-select-hint">${sel.length}/${q.selectCount}個選択</div>`;
  }
  return `<div class="p-q-card"><div class="p-q-num">第${i+1}問</div>
    ${q.prompt.img?`<img class="p-q-img" src="${q.prompt.img}">`:''}
    <div class="p-q-text">${escapeHtml(q.prompt.text)}</div>
    <div class="p-answer">${answerHtml}</div></div>`;
}
function attachParticipantQualifyingEvents(){
  document.querySelectorAll('.p-text-input').forEach(inp=>{
    inp.addEventListener('input', ()=>{
      qualifyingLocal.answers[inp.dataset.qid] = {text:inp.value};
      sendAnswerUpdate();
    });
  });
  document.querySelectorAll('.p-choice').forEach(el=>{
    el.addEventListener('click', ()=>{
      const qid=el.dataset.qid, ci=Number(el.dataset.ci);
      const q=qualifyingLocal.questions.find(q=>q.id===qid);
      const ans=qualifyingLocal.answers[qid]||{selected:[]}; if(!ans.selected) ans.selected=[];
      const pos=ans.selected.indexOf(ci);
      if(pos>=0){ ans.selected.splice(pos,1); }
      else {
        if(ans.selected.length>=q.selectCount){ flashMessage('最大'+q.selectCount+'個まで選択できます'); return; }
        ans.selected.push(ci);
      }
      qualifyingLocal.answers[qid]=ans;
      renderQuestionsArea();
      sendAnswerUpdate();
    });
  });
}
function sendAnswerUpdate(){ if(myConn&&myConn.open) myConn.send({type:'answer_update', playerId:myPlayerId, answers:qualifyingLocal.answers}); }
function startParticipantTimer(){
  clearInterval(participantTimerHandle);
  const startedAt=qualifyingLocal.startedAt, duration=qualifyingLocal.durationMs;
  participantTimerHandle=setInterval(()=>{
    const remain=startedAt+duration-Date.now();
    const el=document.getElementById('p-timer'); if(el) el.textContent=fmtTime(remain);
    if(remain<=0){ clearInterval(participantTimerHandle); }
  },250);
}
function confirmSubmitQualifying(){
  const unanswered=[];
  qualifyingLocal.questions.forEach((q,i)=>{
    const ans=qualifyingLocal.answers[q.id];
    const empty = !ans || (q.type==='text'? !(ans.text&&ans.text.trim()) : !(ans.selected&&ans.selected.length));
    if(empty) unanswered.push(i+1);
  });
  let msg='提出します。よろしいですか？';
  if(unanswered.length) msg = '第'+unanswered.join('、')+'問が未回答です。このまま提出しますか？';
  if(confirm(msg)){ doSubmitQualifying(); }
}
function doSubmitQualifying(){
  qualifyingLocal.submitted=true;
  if(myConn&&myConn.open) myConn.send({type:'qualifying_submit', playerId:myPlayerId, answers:qualifyingLocal.answers});
  document.getElementById('participant-root').innerHTML = `<div class="p-center"><h2>提出しました</h2><p>結果発表をお待ちください。</p></div>`;
  clearInterval(participantTimerHandle);
}
function forceSubmitQualifying(){
  if(qualifyingLocal.submitted) return;
  if(lastPayload && lastPayload.phase==='qualifying'){ doSubmitQualifying(); }
}

/* ---- participant: semifinal ---- */
function renderSemifinalParticipant(payload){
  const root=document.getElementById('participant-root');
  if(payload.alreadyAdvanced){
    root.innerHTML = `<div class="p-center"><p class="tag tag-pass">決勝進出決定！</p><p>${escapeHtml(payload.question?payload.question.text:'')}</p><p>他の対象者の結果をお待ちください。</p></div>`;
    return;
  }
  if(payload.submitted){
    root.innerHTML = `<div class="p-center"><h2>回答しました</h2><p>結果発表をお待ちください。</p></div>`;
    return;
  }
  root.innerHTML = `<div class="p-semifinal">
    <div class="p-timer-bar"><span id="p-timer">--:--</span></div>
    ${!payload.isTarget?'<p class="tag tag-warn">あなたは今回対象外です（参考回答）</p>':''}
    ${payload.question&&payload.question.img?`<img class="p-q-img" src="${payload.question.img}">`:''}
    <div class="p-q-text">${escapeHtml(payload.question?payload.question.text:'')}</div>
    <input type="number" id="sf-input" placeholder="予想する数字"><br>
    <button id="btn-submit-sf">送信</button>
  </div>`;
  document.getElementById('btn-submit-sf').addEventListener('click', ()=>{
    const v=document.getElementById('sf-input').value;
    if(v===''){ alert('数字を入力してください'); return; }
    if(myConn&&myConn.open) myConn.send({type:'semifinal_answer', playerId:myPlayerId, value:Number(v)});
    payload.submitted=true; renderSemifinalParticipant(payload);
  });
  if(semifinalLocalSubmittedFor!==payload.startedAt){ semifinalLocalSubmittedFor=payload.startedAt; startSemifinalParticipantTimer(payload); }
}
function startSemifinalParticipantTimer(payload){
  clearInterval(participantTimerHandle);
  participantTimerHandle=setInterval(()=>{
    const remain=payload.startedAt+payload.durationMs-Date.now();
    const el=document.getElementById('p-timer'); if(el) el.textContent=fmtTime(remain);
    if(remain<=0) clearInterval(participantTimerHandle);
  },250);
}

/* ---- participant: final ---- */
function renderFinalParticipant(payload){
  const root=document.getElementById('participant-root');
  const scoresHtml=(payload.scores||[]).map(s=>`<div class="final-score-row">${escapeHtml(s.name)}: ${s.count}/3</div>`).join('');
  root.innerHTML = `<div class="p-final">
    ${payload.question&&payload.question.img?`<img class="p-q-img" src="${payload.question.img}">`:''}
    <div class="p-q-text">${escapeHtml(payload.question?payload.question.text:'')}</div>
    ${payload.amFinalist? (payload.locked? '<p class="tag tag-fail">解答権なし</p>' : '<p class="tag tag-pass">解答権あり</p>') : ''}
    <div class="final-scores">${scoresHtml}</div>
  </div>`;
}
</script>
